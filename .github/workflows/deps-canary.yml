name: Latest-deps canary

# Weekly early warning: install the absolute latest release of every
# dependency (including majors Dependabot hasn't PR'd yet), then run the full
# verification. A red run here means an upstream engine changed something
# before it reaches a Dependabot PR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Verify against latest everything
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Update everything to latest
        run: pnpm update --latest

      - name: Report resolved versions
        run: pnpm list --depth 0

      # Same gate as CI, including the Node ESM smoke test — engine output
      # changes and interop breakage both surface here.
      - name: Verify
        run: pnpm run verify
