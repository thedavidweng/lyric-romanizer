name: Latest-deps canary

# Weekly early warning: install the absolute latest release of every
# dependency (including majors Dependabot hasn't PR'd yet), then run the full
# verification. A red run here means an upstream engine changed something
# before it reaches a Dependabot PR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  canary:
    name: Verify against latest everything
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true

      - name: Update everything to latest
        run: bun update --latest

      - name: Report resolved versions
        run: bun pm ls

      # Same gate as CI, including the Node ESM smoke test — engine output
      # changes and interop breakage both surface here.
      - name: Verify
        run: bun run verify
